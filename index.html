<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPA Ledger — UOR FOE</title>
<link rel="stylesheet" href="main.css">
</head>
<body>

<div class="app-shell">

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <div class="topbar-brand">
      <svg width="24" height="24" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 2L27 8.5V21.5L15 28L3 21.5V8.5L15 2Z" stroke="var(--accent)" stroke-width="1.6"/>
        <path d="M15 9L21 12.5V19.5L15 23L9 19.5V12.5L15 9Z" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="1.4"/>
      </svg>
      <span>GPA Ledger</span>
    </div>

    <div class="topbar-cgpa" id="cgpa-badge">
      <span class="cgpa-label">CGPA</span>
      <span class="cgpa-value" id="cgpa-value">—</span>
    </div>

    <div class="topbar-user">
      <span class="user-email" id="user-email">…</span>
      <a href="admin.html" id="admin-link" class="admin-link hidden">Admin</a>
      <button id="signout-btn" class="signout-btn" type="button">Sign out</button>
    </div>
  </header>

  <div class="app-body">

    <!-- ============ SIDEBAR / TABS ============ -->
    <nav class="tab-rail" id="tab-rail" aria-label="Semesters">
      <!-- populated by JS: Semester 1..8, Profile -->
    </nav>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="content" id="content">

      <div id="loading-state" class="loading-state">
        <div class="spinner"></div>
        <p>Loading your ledger…</p>
      </div>

      <div id="no-department-banner" class="banner hidden">
        <strong>Pick your department first.</strong>
        <span>Semesters 3–8 are department-specific. Go to the <button type="button" class="link-btn" id="goto-profile-btn">Profile tab</button> and choose DEIE, DMME, DMENA, DCEE or DCE to unlock them.</span>
      </div>

      <!-- ===== SEMESTER PANEL TEMPLATE (cloned per semester) ===== -->
      <template id="semester-panel-template">
        <section class="semester-panel hidden" data-panel>
          <div class="panel-header">
            <div>
              <p class="panel-eyebrow" data-eyebrow>BATCH · YEAR</p>
              <h2 data-title>Semester</h2>
            </div>
            <div class="panel-stats" data-stats>
              <div class="stat"><span class="stat-num" data-stat-modules>0</span><span class="stat-label">Modules</span></div>
              <div class="stat"><span class="stat-num" data-stat-credits>0</span><span class="stat-label">Credits</span></div>
              <div class="stat"><span class="stat-num accent" data-stat-graded>0</span><span class="stat-label">Graded</span></div>
              <div class="stat"><span class="stat-num warn" data-stat-pending>0</span><span class="stat-label">Pending</span></div>
              <div class="stat"><span class="stat-num gold" data-stat-sgpa>0.00</span><span class="stat-label">SGPA</span></div>
            </div>
          </div>

          <!-- target GPA planner: shown only for semester 1 & 2 -->
          <div class="target-box hidden" data-target-box>
            <div class="target-row">
              <label for="">Target GPA for this semester</label>
              <input type="number" step="0.01" min="0" max="4" placeholder="e.g. 3.70" data-target-input>
              <button type="button" class="btn btn-ghost" data-target-calc>Calculate what I need</button>
            </div>
            <p class="target-result" data-target-result></p>
          </div>

          <div class="table-wrap">
            <table class="module-table">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Module</th>
                  <th>Credits</th>
                  <th>Grade</th>
                </tr>
              </thead>
              <tbody data-tbody></tbody>
            </table>
          </div>

          <div class="panel-footer">
            <span class="save-status" data-save-status></span>
            <button type="button" class="btn btn-primary" data-save-btn>Save changes</button>
          </div>
        </section>
      </template>

      <!-- ===== EMPTY SEMESTER TEMPLATE ===== -->
      <template id="empty-panel-template">
        <section class="semester-panel hidden" data-panel>
          <div class="panel-header">
            <div>
              <p class="panel-eyebrow" data-eyebrow>—</p>
              <h2 data-title>Semester</h2>
            </div>
          </div>
          <div class="empty-state">No modules have been added for this semester yet. Check back once the admin publishes them.</div>
        </section>
      </template>

      <!-- ===== PROFILE PANEL ===== -->
      <section class="semester-panel hidden" id="profile-panel" data-panel>
        <div class="panel-header">
          <div>
            <p class="panel-eyebrow">YOUR DETAILS</p>
            <h2>Profile</h2>
          </div>
        </div>

        <form class="profile-form" id="profile-form">
          <div class="field">
            <label for="p-name">Full name</label>
            <input type="text" id="p-name" placeholder="e.g. A. B. Wijesinghe" required>
          </div>
          <div class="field">
            <label for="p-number">Student number</label>
            <input type="text" id="p-number" placeholder="e.g. EG/2024/1234" required>
          </div>
          <div class="field">
            <label for="p-batch">Batch</label>
            <select id="p-batch" required>
              <option value="" disabled selected>Select batch</option>
              <option value="27">27 Batch</option>
              <option value="26">26 Batch</option>
              <option value="25">25 Batch</option>
              <option value="24">24 Batch</option>
              <option value="23">23 Batch</option>
            </select>
          </div>
          <div class="field">
            <label for="p-dept">Department <span class="hint">(unlocks semesters 3–8)</span></label>
            <select id="p-dept">
              <option value="">Not selected yet</option>
              <option value="DEIE">DEIE — Electrical &amp; Information Eng.</option>
              <option value="DMME">DMME — Mechanical &amp; Manufacturing Eng.</option>
              <option value="DMENA">DMENA — Marine Eng. &amp; Naval Architecture</option>
              <option value="DCEE">DCEE — Civil &amp; Environmental Eng.</option>
              <option value="DCE">DCE — Computer Engineering</option>
            </select>
          </div>
          <div class="panel-footer" style="padding:0; margin-top:8px;">
            <span class="save-status" id="profile-save-status"></span>
            <button type="submit" class="btn btn-primary">Save profile</button>
          </div>
        </form>
      </section>

    </main>
  </div>
</div>

<!-- toast -->
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
