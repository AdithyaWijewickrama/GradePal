<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — Grade Pal</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/analytics.css">
</head>
<body>

<div class="app-shell">
  <header class="topbar">
    <div class="topbar-brand">
      <svg width="24" height="24" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 2L27 8.5V21.5L15 28L3 21.5V8.5L15 2Z" stroke="var(--accent)" stroke-width="1.6"/>
        <path d="M15 9L21 12.5V19.5L15 23L9 19.5V12.5L15 9Z" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="1.4"/>
      </svg>
      <span>Grade Pal <em class="admin-badge">Analytics</em></span>
    </div>
    <div class="topbar-user">
      <span class="user-email" id="user-email">…</span>
      <a href="admin.html" class="admin-link">Admin</a>
      <a href="index.html" class="admin-link">Student view</a>
      <button id="signout-btn" class="signout-btn" type="button">Sign out</button>
    </div>
  </header>

  <div class="app-body" style="flex-direction:column;">
    <main class="content" style="max-width:1080px; margin:0 auto; width:100%;">

      <div id="not-admin-banner" class="banner hidden">
        <strong>Restricted.</strong>
        <span>Your account is not the current admin. Redirecting…</span>
      </div>

      <section class="semester-panel">
        <div class="panel-header"><div><p class="panel-eyebrow">FACULTY-WIDE</p><h2>Overview</h2></div></div>
        <div class="kpi-row" id="kpi-row"></div>
      </section>

      <section class="semester-panel">
        <div class="panel-header"><div><p class="panel-eyebrow">DISTRIBUTION</p><h2>Grades awarded</h2></div></div>
        <div class="bar-chart" id="grade-chart"></div>
      </section>

      <div class="two-col">
        <section class="semester-panel">
          <div class="panel-header"><div><p class="panel-eyebrow">BY DEPARTMENT</p><h2>Average CGPA</h2></div></div>
          <div class="bar-chart" id="dept-chart"></div>
        </section>
        <section class="semester-panel">
          <div class="panel-header"><div><p class="panel-eyebrow">BY BATCH</p><h2>Average CGPA</h2></div></div>
          <div class="bar-chart" id="batch-chart"></div>
        </section>
      </div>

      <section class="semester-panel">
        <div class="panel-header"><div><p class="panel-eyebrow">LEADERBOARD</p><h2>Top performers</h2></div></div>
        <div class="table-wrap">
          <table class="module-table">
            <thead><tr><th>#</th><th>Student</th><th>Batch</th><th>Dept</th><th>Graded</th><th>CGPA</th></tr></thead>
            <tbody id="top-tbody"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="js/analytics.js"></script>
</body>
</html>
